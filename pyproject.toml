[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ahriman"

description = "ArcH linux ReposItory MANager"
readme = "README.md"

requires-python = ">=3.13"

license = {file = "COPYING"}
authors = [
    {name = "ahriman team"},
]

dependencies = [
    "bcrypt",
    "filelock",
    "inflection",
    "pyelftools",
    "requests",
]

dynamic = ["version"]

[project.optional-dependencies]
journald = [
    "systemd-python",
]
# FIXME technically this dependency is required, but in some cases we do not have access to
# the libalpm which is required in order to install the package. Thus in case if we do not
# really need to run the application we can move it to "optional" dependencies
pacman = [
    "pyalpm",
]
reports = [
    "Jinja2",
]
s3 = [
    "boto3",
]
shell = [
    "IPython"
]
stats = [
    "matplotlib",
]
unixsocket = [
    "requests-unixsocket2",  # required by unix socket support
]
validator = [
    "cerberus",
]
web = [
    "aiohttp",
    "aiohttp_cors",
    "aiohttp_jinja2",
    "aiohttp_sse",
]
web-auth = [
    "ahriman[web]",
    "aiohttp_session",
    "aiohttp_security",
    "cryptography",
]
web-docs = [
    "ahriman[web]",
    "aiohttp-apispec",
    "setuptools",  # required by aiohttp-apispec
]
web-metrics = [
    "ahriman[web]",
    "aiohttp-openmetrics",
]
web-oauth2 = [
    "ahriman[web-auth]",
    "aioauth-client",
]

[project.scripts]
ahriman = "ahriman.application.ahriman:run"

[project.urls]
Documentation = "https://ahriman.readthedocs.io/"
Repository = "https://github.com/arcan1s/ahriman"
Changelog = "https://github.com/arcan1s/ahriman/releases"

[dependency-groups]
check = [
    "autopep8",
    "bandit",
    "mypy",
    "pylint",
]
docs = [
     "Sphinx",
     "argparse-manpage",
     "pydeps",
     "shtab",
     "sphinx-argparse",
     "sphinx-rtd-theme>=1.1.1",  # https://stackoverflow.com/a/74355734
]
tests = [
    "pytest",
    "pytest-aiohttp",
    "pytest-cov",
    "pytest-helpers-namespace",
    "pytest-mock",
    "pytest-resource-path",
    "pytest-spec",
]

[tool.hatch.version]
path = "src/ahriman/__init__.py"

[tool.hatch.build.targets.sdist]
include = [
    "/AUTHORS",
    "/CONTRIBUTING.md",
    "/COPYING",
    "/README.md",
    "/SECURITY.md",
    "/frontend",
    "/package",
    "/pyproject.toml",
    "/src",
    "/subpackages.py",
    "/web.png",
]
exclude = [
    "/package/archlinux",
    "/frontend/node_modules",
    "/frontend/package-lock.json",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ahriman"]

[tool.hatch.build.targets.wheel.shared-data]
"package/lib" = "lib"
"package/share" = "share"
