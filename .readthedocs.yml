version: 2

build:
  os: ubuntu-lts-latest
  tools:
    python: "3.13"
  apt_packages:
    - graphviz

python:
  install:
    - requirements: docs/requirements.txt
    - path: ahriman-core
    - path: ahriman-triggers
    - path: ahriman-web

formats:
  - pdf

sphinx:
  builder: html
  configuration: docs/conf.py
  fail_on_warning: true
